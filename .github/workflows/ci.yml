name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Neovim ${{ matrix.neovim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        neovim: [v0.11.7, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            export PATH=/home/linuxbrew/.linuxbrew/bin:$PATH
          fi
          brew install tmux
          tmux -V
      - name: Test
        run: python3 tests/run.py
